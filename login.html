<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogja Wisata - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🌴 Jogja Wisata</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="wisata.html">Destinasi</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="btn btn-light btn-sm ms-lg-2 active" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="text-center judul-section mb-1">Login</h3>
            <p class="text-center text-muted mb-4">Masuk untuk melanjutkan</p>

            <!-- Tempat pesan validasi (alert Bootstrap) -->
            <div id="pesan"></div>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="nama@email.com">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Minimal 6 karakter">
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center text-muted small mt-3 mb-0">
              Validasi hanya dilakukan di sisi browser (bukan sistem login sebenarnya).
            </p>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="index.html">&larr; Kembali ke Beranda</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="py-4 text-center">
    <div class="container">
      <p class="mb-1 fw-semibold">Jogja Wisata</p>
      <small>&copy; 2026 Website Informasi Wisata Daerah. Dibuat untuk tugas Pemrograman Web.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
